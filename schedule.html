<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule 行事曆</title>
<style>
:root{color-scheme:dark;--bg:#161719;--card:#202227;--card2:#292c34;--line:#393d47;--txt:#f7f8fb;--muted:#9aa3b2;--red:#ff3545;--blue:#329dff;--green:#65ca63;--yellow:#f4dc20;--purple:#b65fe0;--pink:#ed5b95;--orange:#ff9b6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:1720px;margin:auto;padding:16px 20px 28px}.top{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:14px}h1{margin:0;color:var(--muted);font-size:clamp(20px,2vw,25px)}h1 b{color:#fff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);width:340px;height:30px;border:1px solid #4a4d56;border-radius:8px;overflow:hidden;background:#3b3d43}.tabs span{display:grid;place-items:center;border-right:1px solid #555963;font-weight:800}.tabs span:last-child{border-right:0}.tabs .on{background:#73757d}.actions{justify-self:end;display:flex;gap:8px;align-items:center}button,input,select,textarea{font:inherit}button{cursor:pointer}.icon,.text,.primary,.secondary{min-height:36px;border-radius:8px;font-weight:850}.icon{width:36px;border:0;background:transparent;color:var(--red);font-size:24px}.text{padding:0 10px;border:0;background:transparent;color:var(--red)}.primary{padding:0 14px;border:0;background:var(--red);color:#fff}.secondary{padding:0 12px;border:1px solid var(--line);background:var(--card2);color:#fff}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.hint{margin:0;color:var(--muted);font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(135px,1fr));border-top:1px solid var(--line)}.weekday{padding:0 8px 7px;color:var(--muted);font-size:17px;font-weight:850}.weekday:nth-child(6){color:var(--red)}.day{min-height:136px;padding:9px 8px;border-top:1px solid var(--line);border-left:1px solid rgba(255,255,255,.03);background:#1a1b1f;overflow:hidden}.day.weekend{background:#202126}.day.outside{opacity:.55}.dateRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}.date{font-weight:900}.today .date{display:grid;place-items:center;width:31px;height:31px;margin-left:-4px;border-radius:50%;background:var(--red);color:#111}.addDay{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.03);color:var(--muted);font-weight:900}.event{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;margin:4px 0;padding:0;border:0;background:transparent;color:#fff;text-align:left}.dot{width:8px;height:8px;border-radius:50%}.eventTitle{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(10px,.72vw,12px);font-weight:850}.eventTime{white-space:nowrap;color:#b7c1cf;font-size:clamp(9px,.65vw,11px);font-weight:750}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.6);z-index:5}.modal.open{display:grid}.dialog{width:min(100%,560px);border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:0 24px 80px #000}.dh,.df{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.df{border-top:1px solid var(--line);border-bottom:0}.dialog h2{margin:0;font-size:19px}form{padding:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{color:var(--muted);font-size:12px;font-weight:850}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:#fff;outline:0}input,select{height:40px;padding:0 11px}textarea{min-height:78px;padding:10px 11px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--red)}.danger{color:#ff8b94;border-color:rgba(255,53,69,.35);background:rgba(255,53,69,.08)}.right{display:flex;gap:8px;margin-left:auto}.toast{position:fixed;right:18px;bottom:18px;display:none;max-width:420px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#30333b;font-weight:750;z-index:8}.toast.show{display:block}@media(max-width:920px){.app{padding:14px}.top{grid-template-columns:1fr}.tabs{width:100%;max-width:370px}.actions{justify-self:stretch;justify-content:space-between}.calendar{display:block;border-top:0}.weekday{display:none}.day{display:none}.day.has,.day.today{display:block;min-height:0;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.eventTitle,.eventTime{font-size:14px}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app"><header class="top"><h1 id="title"></h1><div class="tabs"><span>Day 日</span><span>Week 週</span><span class="on">Month 月</span></div><div class="actions"><button class="icon" id="prev">‹</button><button class="text" id="today">Today 今天</button><button class="icon" id="next">›</button><button class="primary" id="add">＋ Add 新增</button></div></header><section class="bar"><p class="hint">Click a day to add an event. Click an event to edit it. / 按日期新增活動，按活動可更改內容。</p><div><button class="secondary" id="export">Export 匯出</button> <button class="secondary" id="import">Import 匯入</button> <button class="secondary" id="reset">Reset 重設</button></div></section><section class="calendar" id="cal"></section></main>
<section class="modal" id="modal"><div class="dialog"><div class="dh"><h2 id="modalTitle">Add Event 新增活動</h2><button class="icon" id="close">×</button></div><form id="form"><input id="id" type="hidden"><div class="fields"><div class="field"><label>Chinese Title 中文活動名稱</label><input id="zh" required placeholder="例如：跆拳道"></div><div class="field"><label>English Title 英文活動名稱</label><input id="en" required placeholder="e.g. Taekwondo"></div><div class="field"><label>Start 開始時間</label><input id="start" type="datetime-local" required></div><div class="field"><label>End 完結時間</label><input id="end" type="datetime-local" required></div><div class="field"><label>Color 顏色</label><select id="color"><option value="blue">Blue 藍色</option><option value="green">Green 綠色</option><option value="yellow">Yellow 黃色</option><option value="purple">Purple 紫色</option><option value="pink">Pink 粉紅色</option><option value="orange">Orange 橙色</option></select></div><div class="field"><label>Icon 圖示</label><input id="icon" placeholder="例如：🥋"></div><div class="field full"><label>Notes 備註</label><textarea id="notes" placeholder="Optional notes / 可留空"></textarea></div></div></form><div class="df"><button class="secondary danger" id="del">Delete 刪除</button><div class="right"><button class="secondary" id="cancel">Cancel 取消</button><button class="primary" form="form">Save 儲存</button></div></div></div></section><div class="toast" id="toast"></div>
<script>
const KEY="kelvin-schedule-events-v3",C={blue:"var(--blue)",green:"var(--green)",yellow:"var(--yellow)",purple:"var(--purple)",pink:"var(--pink)",orange:"var(--orange)"},W=["Sun 週日","Mon 週一","Tue 週二","Wed 週三","Thu 週四","Fri 週五","Sat 週六"],M=["January 1月","February 2月","March 3月","April 4月","May 5月","June 6月","July 7月","August 8月","September 9月","October 10月","November 11月","December 12月"];let month=new Date(2026,4,1),events=load();const $=s=>document.querySelector(s),cal=$("#cal"),f={id:$("#id"),zh:$("#zh"),en:$("#en"),start:$("#start"),end:$("#end"),color:$("#color"),icon:$("#icon"),notes:$("#notes")};function uid(){return crypto.randomUUID?crypto.randomUUID():"e"+Date.now()+Math.random()}function ev(d,s,e,zh,en,color,icon=""){return{id:uid(),titleZh:zh,titleEn:en,startAt:`2026-05-${String(d).padStart(2,"0")}T${s}`,endAt:`2026-05-${String(d).padStart(2,"0")}T${e}`,color,icon,notes:""}}function seed(){let a=[ev(11,"10:00","11:00","跆拳道","Taekwondo","blue","🥋"),ev(11,"12:55","13:10","Boxhill-Ambassador","Boxhill-Ambassador","green","🎒"),ev(11,"13:15","14:15","Boxhill","Boxhill","green","🎒"),ev(11,"20:10","21:10","網上數學","Online Maths","yellow","📐"),ev(12,"10:55","11:55","GAPSK 考試","GAPSK Exam","green","📝"),ev(12,"12:40","13:40","Boxhill","Boxhill","green","🎒"),ev(12,"17:00","18:00","小王子藝術","Little Prince Art","pink","🎨"),ev(13,"09:30","10:30","科學實驗室","Monster Lab","purple","🧪"),ev(13,"13:15","14:15","Boxhill","Boxhill","green","🎒"),ev(13,"17:00","18:00","思維訓練","Mind power","orange","📝"),ev(14,"12:40","13:40","Boxhill","Boxhill","green","🎒"),ev(14,"20:10","21:10","網上數學","Online Maths","yellow","📐"),ev(15,"09:30","10:30","科學實驗室","Monster Lab","purple","🧪"),ev(15,"13:15","14:15","Boxhill","Boxhill","green","🎒"),ev(16,"09:00","10:00","鋼琴","Piano","green","🎹"),ev(16,"16:00","17:00","科學實驗室","Monster lab","purple","👨🏻‍🔬"),ev(18,"10:00","11:00","跆拳道","Taekwondo","blue","🥋"),ev(18,"13:15","14:15","Boxhill","Boxhill","green","🎒"),ev(18,"20:10","21:10","網上數學","Online Maths","yellow","📐"),ev(19,"12:40","13:40","Boxhill","Boxhill","green","🎒"),ev(19,"17:00","18:00","小王子藝術","Little Prince Art","pink","🎨"),ev(26,"12:40","13:40","Boxhill","Boxhill","green","🎒"),ev(26,"17:00","18:00","小王子藝術","Little Prince Art","pink","🎨"),ev(27,"09:30","10:30","科學實驗室","Monster Lab","purple","🧪"),ev(27,"13:15","14:15","Boxhill 生日派對","Boxhill B-day party","green","🥳 🎒"),ev(27,"17:00","18:00","思維訓練","Mind power","orange","📝"),ev(28,"20:10","21:10","網上數學","Online Maths","yellow","📐"),ev(29,"09:30","10:30","科學實驗室","Monster Lab","purple","🧪"),ev(29,"17:30","18:30","思維訓練","Mind power","orange","📝"),ev(30,"09:00","10:00","鋼琴","Piano","green","🎹"),ev(30,"10:20","11:20","面試班","Interview class","yellow","📚")];[["2026-06-01T10:00","2026-06-01T11:00","跆拳道","Taekwondo","blue","🥋"],["2026-06-01T13:15","2026-06-01T14:15","Boxhill","Boxhill","green","🎒"],["2026-06-01T20:10","2026-06-01T21:10","網上數學","Online Maths","yellow","📐"],["2026-06-02T12:15","2026-06-02T13:15","Boxhill 彩排","Boxhill Rehearsal","green","⭐ 🎁"],["2026-06-03T09:30","2026-06-03T10:30","科學實驗室","Monster Lab","purple","🧪"],["2026-06-03T13:15","2026-06-03T14:15","Boxhill","Boxhill","green","🎒"],["2026-06-03T17:00","2026-06-03T18:00","思維訓練","Mind power","orange","📝"],["2026-06-04T12:40","2026-06-04T13:40","Boxhill","Boxhill","green","🎒"],["2026-06-04T20:10","2026-06-04T21:10","網上數學","Online Maths","yellow","📐"],["2026-06-05T09:30","2026-06-05T10:30","科學實驗室","Monster Lab","purple","🧪"],["2026-06-05T13:15","2026-06-05T14:15","Boxhill","Boxhill","green","🎒"],["2026-06-06T09:00","2026-06-06T10:00","鋼琴","Piano","green","🎹"],["2026-06-06T10:20","2026-06-06T11:20","面試班","Interview class","yellow","📚"]].forEach(x=>a.push({id:uid(),startAt:x[0],endAt:x[1],titleZh:x[2],titleEn:x[3],color:x[4],icon:x[5],notes:""}));return a}function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function save(){localStorage.setItem(KEY,JSON.stringify(events))}function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function dt(d,h=9,m=0){let x=new Date(d);x.setHours(h,m,0,0);return key(x)+"T"+String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")}function time(e){let a=new Date(e.startAt),b=new Date(e.endAt),o={hour:"2-digit",minute:"2-digit"};return a.toLocaleTimeString("zh-HK",o)+"-"+b.toLocaleTimeString("zh-HK",o)}function msg(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}function render(){cal.innerHTML="";let y=month.getFullYear(),m=month.getMonth();$("#title").innerHTML=`${y} <b>${M[m]}</b>`;W.forEach(w=>{let h=document.createElement("div");h.className="weekday";h.textContent=w;cal.appendChild(h)});let first=new Date(y,m,1),start=new Date(first);start.setDate(first.getDate()-first.getDay());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d),list=events.filter(e=>e.startAt.slice(0,10)===k).sort((a,b)=>a.startAt.localeCompare(b.startAt)),now=new Date,cell=document.createElement("article");cell.className=["day",d.getMonth()!=m?"outside":"",[0,6].includes(d.getDay())?"weekend":"",key(now)===k?"today":"",list.length?"has":""].filter(Boolean).join(" ");cell.innerHTML=`<div class="dateRow"><span class="date">${d.getDate()}日</span><button class="addDay">+</button></div>`;cell.querySelector("button").onclick=()=>openNew(d);list.forEach(e=>{let b=document.createElement("button");b.className="event";b.innerHTML=`<i class="dot" style="background:${C[e.color]||C.blue}"></i><span class="eventTitle">${e.icon?e.icon+" ":""}${e.titleZh} / ${e.titleEn}</span><span class="eventTime">${time(e)}</span>`;b.onclick=()=>openEdit(e.id);cell.appendChild(b)});cal.appendChild(cell)}}function openNew(d=month){f.id.value="";f.zh.value="";f.en.value="";f.start.value=dt(d);f.end.value=dt(d,10);f.color.value="blue";f.icon.value="";f.notes.value="";$("#modalTitle").textContent="Add Event 新增活動";$("#del").style.visibility="hidden";$("#modal").classList.add("open");f.zh.focus()}function openEdit(id){let e=events.find(x=>x.id===id);if(!e)return;f.id.value=e.id;f.zh.value=e.titleZh;f.en.value=e.titleEn;f.start.value=e.startAt;f.end.value=e.endAt;f.color.value=e.color;f.icon.value=e.icon||"";f.notes.value=e.notes||"";$("#modalTitle").textContent="Edit Event 更改活動";$("#del").style.visibility="visible";$("#modal").classList.add("open")}function closeM(){$("#modal").classList.remove("open")}$("#form").onsubmit=e=>{e.preventDefault();if(f.end.value<=f.start.value)return msg("End time must be after start time / 完結時間必須遲過開始時間");let data={id:f.id.value||uid(),titleZh:f.zh.value.trim(),titleEn:f.en.value.trim(),startAt:f.start.value,endAt:f.end.value,color:f.color.value,icon:f.icon.value.trim(),notes:f.notes.value.trim()};events=f.id.value?events.map(x=>x.id===data.id?data:x):events.concat(data);save();render();closeM();msg("Saved / 已儲存")};$("#del").onclick=()=>{events=events.filter(x=>x.id!==f.id.value);save();render();closeM();msg("Deleted / 已刪除")};$("#close").onclick=$("#cancel").onclick=closeM;$("#add").onclick=()=>openNew(new Date(month));$("#prev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$("#next").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$("#today").onclick=()=>{let n=new Date;month=new Date(n.getFullYear(),n.getMonth(),1);render()};$("#reset").onclick=()=>{events=seed();save();month=new Date(2026,4,1);render();msg("Reset / 已重設")};$("#export").onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(events,null,2));msg("Copied JSON / 已複製 JSON")};$("#import").onclick=()=>{let t=prompt("Paste exported JSON / 貼上已匯出的 JSON");if(!t)return;try{events=JSON.parse(t);save();render();msg("Imported / 已匯入")}catch{msg("Import failed / 匯入失敗")}};$("#modal").onclick=e=>{if(e.target.id==="modal")closeM()};render();
</script>
</body>
</html>
