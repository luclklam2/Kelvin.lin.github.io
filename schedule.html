<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026年5-6月行事曆</title>
  <style>
    :root {
      --bg: #12141b;
      --bg-soft: #181b24;
      --line: #2a2f3a;
      --text: #e9edf7;
      --muted: #8290ad;
      --accent: #ff3c4d;
      --blue: #44a2ff;
      --green: #72d572;
      --yellow: #f4e65a;
      --purple: #c680ff;
      --pink: #ff79c6;
      --orange: #ffae7d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 500px at 50% -10%, #1a1f2f 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 12px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .center-tabs {
      display: inline-flex;
      border: 1px solid #4a4f5a;
      border-radius: 9px;
      overflow: hidden;
      background: #2e323d;
      justify-self: center;
    }

    .center-tabs button {
      width: 110px;
      padding: 8px 0;
      border: none;
      color: #d9deea;
      background: transparent;
      cursor: default;
      font-weight: 700;
      opacity: 0.75;
    }

    .center-tabs button.active {
      background: #5d616b;
      opacity: 1;
    }

    .actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      color: var(--accent);
      user-select: none;
    }

    .actions button {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    .actions .today {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .dow, .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .dow div {
      padding: 10px 8px;
      color: #8ea0c4;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 34px;
      font-weight: 800;
    }

    .dow div.friday { color: var(--accent); }

    .cell {
      min-height: 190px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(16, 19, 27, 0.72);
      padding: 8px;
      position: relative;
      cursor: pointer;
    }

    .cell:nth-child(7n+1) { border-left: 1px solid var(--line); }

    .date-num {
      font-size: 34px;
      font-weight: 800;
      color: #f1f4ff;
      margin-bottom: 8px;
      display: inline-block;
      padding: 0 4px;
      border-radius: 999px;
    }

    .other-month .date-num { color: #3e495f; }
    .today-mark .date-num { background: var(--accent); color: #fff; }

    .event {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin: 4px 0;
      border-radius: 7px;
      padding: 2px 4px;
    }

    .event:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .event-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 700;
    }

    .event-time {
      color: #abc0e4;
      font-size: 12px;
      font-weight: 700;
    }

    .legend {
      padding: 10px 0;
      color: #97a7c8;
      font-size: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 12px;
    }

    .modal {
      width: min(580px, 100%);
      background: #171b26;
      border: 1px solid #333a4a;
      border-radius: 12px;
      padding: 14px;
    }

    .modal h3 { margin: 0 0 12px; }
    .row { display: grid; gap: 8px; margin-bottom: 10px; }
    .row.two { grid-template-columns: 1fr 1fr; }

    input, select {
      width: 100%;
      background: #111521;
      color: #eaf0ff;
      border: 1px solid #31394c;
      border-radius: 7px;
      padding: 10px;
    }

    .modal-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid #3a4358;
      background: #222a3a;
      color: #e9efff;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn.primary { background: #2f6feb; border-color: #2f6feb; }
    .btn.danger { background: #a12638; border-color: #a12638; }

    @media (max-width: 900px) {
      .title { font-size: 24px; }
      .dow div { font-size: 24px; }
      .date-num { font-size: 24px; }
      .cell { min-height: 140px; }
      .event { font-size: 12px; }
      .event-time { display: none; }
      .actions .today { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div id="title" class="title">2026年 5月</div>
      <div class="center-tabs">
        <button>日</button>
        <button>週</button>
        <button class="active">月</button>
      </div>
      <div class="actions">
        <button id="prevBtn">‹</button>
        <button id="todayBtn" class="today">今天</button>
        <button id="nextBtn">›</button>
        <button id="addBtn">+</button>
      </div>
    </div>

    <div class="dow">
      <div>週日</div><div>週一</div><div>週二</div><div>週三</div><div>週四</div><div class="friday">週五</div><div>週六</div>
    </div>
    <div id="grid" class="grid"></div>

    <div class="legend">
      <span><i class="dot" style="background:#44a2ff"></i>Taekwondo</span>
      <span><i class="dot" style="background:#72d572"></i>Boxhill / Piano</span>
      <span><i class="dot" style="background:#f4e65a"></i>Online Maths / Interview</span>
      <span><i class="dot" style="background:#c680ff"></i>Monster Lab</span>
      <span><i class="dot" style="background:#ff79c6"></i>Little Prince Art</span>
      <span><i class="dot" style="background:#ffae7d"></i>Mind power</span>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <h3 id="modalTitle">新增行程</h3>
      <div class="row two">
        <div>
          <label>日期</label>
          <input id="eventDate" type="date" />
        </div>
        <div>
          <label>時間</label>
          <input id="eventTime" type="time" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>行程名稱</label>
          <input id="eventName" type="text" placeholder="例如：Boxhill" />
        </div>
      </div>
      <div class="row two">
        <div>
          <label>分類</label>
          <input id="eventType" type="text" placeholder="例如：Boxhill" />
        </div>
        <div>
          <label>顏色</label>
          <select id="eventColor">
            <option value="#44a2ff">藍</option>
            <option value="#72d572">綠</option>
            <option value="#f4e65a">黃</option>
            <option value="#c680ff">紫</option>
            <option value="#ff79c6">粉</option>
            <option value="#ffae7d">橙</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelBtn">取消</button>
        <button class="btn danger" id="deleteBtn" style="display:none">刪除</button>
        <button class="btn primary" id="saveBtn">儲存</button>
      </div>
    </div>
  </div>

  <script>
    const storageKey = "calendar_2026_may_june";
    const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    const initialEvents = [
      { date: "2026-05-11", time: "10:00", name: "Taekwondo", type: "Taekwondo", color: "#44a2ff" },
      { date: "2026-05-11", time: "13:15", name: "Boxhill", type: "Boxhill", color: "#72d572" },
      { date: "2026-05-11", time: "20:10", name: "Online Maths", type: "Online Maths", color: "#f4e65a" },
      { date: "2026-05-12", time: "10:55", name: "GAPSK Exam", type: "Exam", color: "#72d572" },
      { date: "2026-05-12", time: "12:40", name: "Boxhill", type: "Boxhill", color: "#72d572" },
      { date: "2026-05-12", time: "17:00", name: "Little Prince Art", type: "Art", color: "#ff79c6" },
      { date: "2026-05-13", time: "09:30", name: "Monster Lab", type: "Monster Lab", color: "#c680ff" },
      { date: "2026-05-13", time: "13:15", name: "Boxhill", type: "Boxhill", color: "#72d572" },
      { date: "2026-05-13", time: "17:00", name: "Mind power", type: "Mind power", color: "#ffae7d" },
      { date: "2026-05-30", time: "10:20", name: "Interview class", type: "Interview", color: "#f4e65a" },
      { date: "2026-06-01", time: "10:00", name: "Taekwondo", type: "Taekwondo", color: "#44a2ff" },
      { date: "2026-06-01", time: "13:15", name: "Boxhill", type: "Boxhill", color: "#72d572" },
      { date: "2026-06-01", time: "20:10", name: "Online Maths", type: "Online Maths", color: "#f4e65a" },
      { date: "2026-06-03", time: "09:30", name: "Monster Lab", type: "Monster Lab", color: "#c680ff" },
      { date: "2026-06-03", time: "13:15", name: "Boxhill", type: "Boxhill", color: "#72d572" },
      { date: "2026-06-03", time: "17:00", name: "Mind power", type: "Mind power", color: "#ffae7d" },
      { date: "2026-06-06", time: "09:00", name: "Piano", type: "Piano", color: "#72d572" },
      { date: "2026-06-06", time: "10:20", name: "Interview class", type: "Interview", color: "#f4e65a" }
    ];

    let events = loadEvents();
    let current = new Date(2026, 4, 1);
    let editingId = null;
    let selectedDate = null;

    function uid() { return Math.random().toString(36).slice(2, 10); }
    function loadEvents() {
      const raw = localStorage.getItem(storageKey);
      if (raw) return JSON.parse(raw);
      const seeded = initialEvents.map(e => ({ id: uid(), ...e }));
      localStorage.setItem(storageKey, JSON.stringify(seeded));
      return seeded;
    }
    function saveEvents() { localStorage.setItem(storageKey, JSON.stringify(events)); }

    function formatCNTime(t) {
      if (!t) return "";
      const [h, m] = t.split(":").map(Number);
      const isPM = h >= 12;
      const hh = h % 12 === 0 ? 12 : h % 12;
      return `${isPM ? "下午" : "上午"}${hh}:${String(m).padStart(2, "0")}`;
    }

    function monthGrid(dateObj) {
      const y = dateObj.getFullYear();
      const m = dateObj.getMonth();
      const first = new Date(y, m, 1);
      const start = new Date(first);
      start.setDate(1 - first.getDay());
      const arr = [];
      for (let i = 0; i < 42; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        arr.push(d);
      }
      return arr;
    }

    function iso(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function render() {
      document.getElementById("title").textContent = `${current.getFullYear()}年 ${monthNames[current.getMonth()]}`;
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const todayIso = iso(new Date());
      for (const d of monthGrid(current)) {
        const cell = document.createElement("div");
        const dIso = iso(d);
        cell.className = "cell";
        if (d.getMonth() !== current.getMonth()) cell.classList.add("other-month");
        if (dIso === todayIso) cell.classList.add("today-mark");

        const num = document.createElement("div");
        num.className = "date-num";
        num.textContent = `${d.getDate()}日`;
        cell.appendChild(num);

        const dayEvents = events
          .filter(e => e.date === dIso)
          .sort((a, b) => (a.time || "").localeCompare(b.time || ""));

        for (const e of dayEvents) {
          const row = document.createElement("div");
          row.className = "event";
          row.innerHTML = `
            <i class="dot" style="background:${e.color || "#72d572"}"></i>
            <span class="event-name">${e.name}</span>
            <span class="event-time">${formatCNTime(e.time)}</span>
          `;
          row.addEventListener("click", (ev) => {
            ev.stopPropagation();
            openModal(e.id);
          });
          cell.appendChild(row);
        }

        cell.addEventListener("click", () => {
          selectedDate = dIso;
          openModal();
        });
        grid.appendChild(cell);
      }
    }

    function openModal(id = null) {
      editingId = id;
      const modal = document.getElementById("modalBackdrop");
      const delBtn = document.getElementById("deleteBtn");
      const title = document.getElementById("modalTitle");
      const date = document.getElementById("eventDate");
      const time = document.getElementById("eventTime");
      const name = document.getElementById("eventName");
      const type = document.getElementById("eventType");
      const color = document.getElementById("eventColor");

      if (id) {
        const e = events.find(x => x.id === id);
        title.textContent = "編輯行程";
        date.value = e.date;
        time.value = e.time || "";
        name.value = e.name || "";
        type.value = e.type || "";
        color.value = e.color || "#72d572";
        delBtn.style.display = "inline-block";
      } else {
        title.textContent = "新增行程";
        date.value = selectedDate || iso(new Date(current.getFullYear(), current.getMonth(), 1));
        time.value = "";
        name.value = "";
        type.value = "";
        color.value = "#72d572";
        delBtn.style.display = "none";
      }

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalBackdrop").style.display = "none";
      editingId = null;
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      const date = document.getElementById("eventDate").value;
      const time = document.getElementById("eventTime").value;
      const name = document.getElementById("eventName").value.trim();
      const type = document.getElementById("eventType").value.trim();
      const color = document.getElementById("eventColor").value;

      if (!date || !name) {
        alert("請至少輸入日期同名稱");
        return;
      }

      if (editingId) {
        events = events.map(e => e.id === editingId ? { ...e, date, time, name, type, color } : e);
      } else {
        events.push({ id: uid(), date, time, name, type, color });
      }

      saveEvents();
      closeModal();
      render();
    });

    document.getElementById("deleteBtn").addEventListener("click", () => {
      if (!editingId) return;
      events = events.filter(e => e.id !== editingId);
      saveEvents();
      closeModal();
      render();
    });

    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      current = new Date(current.getFullYear(), current.getMonth() - 1, 1);
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
      render();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      const now = new Date();
      current = new Date(now.getFullYear(), now.getMonth(), 1);
      render();
    });

    document.getElementById("addBtn").addEventListener("click", () => {
      selectedDate = iso(new Date(current.getFullYear(), current.getMonth(), 1));
      openModal();
    });

    render();
  </script>
</body>
</html>
