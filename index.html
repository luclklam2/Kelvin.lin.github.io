<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jadon 的 12 個成長故事</title>
<style>
:root{--orange:#ff8a3d;--yellow:#fff1a8;--blue:#2d6cdf;--ink:#2b2b2b}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;background:linear-gradient(180deg,#e8f8ff,#fff7e8);color:var(--ink)}.hero{text-align:center;padding:34px 18px;background:linear-gradient(180deg,#cfefff,#fff);position:relative}.hero h1{font-size:clamp(34px,6vw,62px);margin:0;color:#875018}.hero p{font-size:21px;color:#555;margin:8px 0}.langbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #e6f1ff;padding:12px;text-align:center}.langbtn{border:2px solid var(--orange);background:white;color:#9b5200;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;margin:0 5px}.langbtn.active{background:var(--orange);color:white}.wrap{max-width:1280px;margin:auto;padding:22px}.poster,.card{background:#fff;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.08)}.poster{padding:18px;text-align:center}.poster img,.storyimg{width:100%;border-radius:18px;cursor:zoom-in}.poster img{max-width:1180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;margin-top:26px}.card{padding:22px;animation:rise .45s ease both}.card h2{color:var(--blue);font-size:25px;margin:8px 0 10px}.card p{font-size:19px;line-height:1.95}.moral{background:#fff3d6;padding:12px;border-radius:14px;font-weight:700;color:#9c6200;margin-top:14px}.btn{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:16px;cursor:pointer;margin-top:14px}.char.active{background:var(--yellow);border-radius:6px;box-shadow:0 0 0 3px var(--yellow)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:99}.modal.open{display:flex}.modal img{max-width:96vw;max-height:90vh;border-radius:18px}.storyimg{margin-bottom:14px;height:190px;object-fit:cover}.small{font-size:14px;color:#777;margin-top:10px}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:640px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}.card p{font-size:17px}.storyimg{height:160px}}
</style>
</head>
<body>
<section class="hero"><h1 id="pageTitle">Jadon 的 12 個成長故事</h1><p id="pageSub">陪伴孩子快樂成長的每一天 💕</p></section>
<div class="langbar"><button class="langbtn active" id="btnZh" onclick="setLang('zh')">中文</button><button class="langbtn" id="btnEn" onclick="setLang('en')">English</button></div>
<div class="wrap"><section class="poster"><img src="storybook.png" onclick="openZoom()" alt="storybook"><div><button class="btn" onclick="playAll()" id="playAllBtn">🎙️ 真人廣東話順序播放</button></div><p class="small" id="audioNote">可上載 audio/story1.mp3 至 audio/story12.mp3 使用真人錄音；未有錄音時會用瀏覽器朗讀。</p></section><section class="grid" id="grid"></section></div>
<div class="modal" onclick="closeZoom()"><img src="storybook.png" alt="zoom"></div>
<script>
const stories={zh:[
{t:'去公園學分享',s:'今天，爸爸媽媽帶Jadon去公園玩。公園裡有很多小朋友，有人拍球，有人玩滑梯。Jadon拿著自己的小足球開心地跑來跑去。忽然，一個小朋友走過來，小聲地問：「我可以一起玩嗎？」Jadon笑著回答：「好呀！我們一起玩吧！」兩個小朋友一起傳球、追球，玩得很開心。回家時，媽媽說：「願意分享的人，會有更多朋友。」Jadon點點頭。',m:'道理：學會分享，朋友會更多。'},
{t:'第一次游水',s:'夏天天氣很熱，爸爸帶Jadon去海邊游水。大大的海浪不停拍過來，Jadon有點怕，一直拉著爸爸的手。爸爸笑著說：「不用怕，我會陪住你。」爸爸慢慢教他用手拍水，又輕輕踢腳。過了一會兒，Jadon真的可以自己浮起來了！他高興地大叫：「爸爸，我做到啦！」媽媽在旁邊幫他拍照。晚上回家後，Jadon一直笑著說自己很勇敢。',m:'道理：不要害怕嘗試，新事情會讓自己進步。'},
{t:'小兔迷路了',s:'一天，Jadon和媽媽去農場看動物。Jadon最喜歡白色的小兔子。忽然，一隻小兔跑出了小木屋，不停四處走來走去，好像找不到回家的路。Jadon很擔心地說：「媽媽，小兔是不是迷路了？」媽媽點點頭。於是Jadon慢慢走近小兔，輕輕抱起牠，再把牠送回木屋。農場叔叔笑著說：「謝謝你，小兔終於回家了。」',m:'道理：幫助別人，自己也會快樂。'},
{t:'學寫字',s:'今天，爸爸陪Jadon在家裡學寫字。爸爸先寫「一、二、三、四、五」，再教「六、七、八、九、十」。Jadon一開始寫得歪歪的，有點不高興。他說：「我寫不好。」爸爸笑著回答：「不用急，慢慢來就可以。」Jadon再一次認真地寫。最後，他終於把字寫得整整齊齊。媽媽看見後開心地拍手說：「Jadon進步了！」',m:'道理：只要有耐心，就會慢慢進步。'},
{t:'公園的小朋友',s:'下午，很多小朋友在公園裡玩。Jadon和朋友一起踢球、唱歌，又一起玩滑梯。忽然，一個小朋友跌倒了，坐在地上哭。Jadon立刻跑過去扶他起來，還幫他輕輕拍走身上的沙。老師看見後說：「Jadon真有愛心。」小朋友也笑著說：「謝謝你。」之後，大家又一起開心地玩遊戲。',m:'道理：主動幫助別人，是很重要的。'},
{t:'一家人的晚飯',s:'外面下著大雨，Jadon一家人在家裡吃晚飯。媽媽在廚房煮菜，爸爸幫忙整理餐桌。Jadon也很乖，主動幫忙拿碗和筷子。吃飯的時候，大家一起分享今天發生的事情。爸爸笑著說：「一家人在一起，就是最幸福的時光。」Jadon一邊吃飯，一邊開心地笑，家裡充滿溫暖。',m:'道理：一家人互相關心，就是幸福。'},
{t:'巴士上的禮貌',s:'今天，媽媽帶Jadon坐巴士去圖書館。上車後，Jadon看見一位婆婆慢慢走上來，可是已經沒有座位了。媽媽輕輕問：「讓座給婆婆，好嗎？」Jadon立刻站起來，笑著說：「婆婆，請坐！」婆婆很開心，摸摸Jadon的頭說：「你真是個有禮貌的好孩子。」媽媽也露出驕傲的笑容。',m:'道理：有禮貌和關心別人，大家都會開心。'},
{t:'去動物園',s:'星期天，爸爸媽媽帶Jadon去動物園。Jadon看見長頸鹿、大象、小羊和白兔，高興得不停拍手。他興奮地說：「爸爸！長頸鹿真的好高呀！」爸爸笑著回答：「因為牠的脖子很長。」後來，大家又一起看海獅表演。媽媽提醒Jadon：「看動物時不要大叫，也不要亂餵食物。」Jadon乖乖點頭。',m:'道理：欣賞動物時，要愛護和尊重牠們。'},
{t:'四季的變化',s:'一年有春、夏、秋、冬四個季節。春天開滿鮮花，小鳥在樹上唱歌；夏天天氣很熱，Jadon最喜歡去游泳；秋天的樹葉慢慢變成紅色和黃色；冬天很冷，大家都穿上暖暖的外套。老師問：「你最喜歡哪一個季節？」Jadon想了想，笑著回答：「每一個季節我都喜歡，因為都有不同的快樂！」',m:'道理：學會欣賞生活中的不同美好。'},
{t:'數水果',s:'今天，媽媽買了很多水果回家。桌上有大西瓜、紅蘋果、香蕉和橙。爸爸笑著問Jadon：「你可以幫我們數水果嗎？」Jadon立刻伸出小手，一邊數，一邊開心地讀：「一、二、三、四……」最後，他成功算出總數。媽媽稱讚他：「Jadon真的越來越聰明了！」大家之後一起分享甜甜的水果。',m:'道理：學習和分享，都可以帶來快樂。'},
{t:'飛機旅行',s:'暑假到了，Jadon第一次坐飛機去旅行。飛機慢慢飛上天空時，Jadon有一點害怕，於是緊緊拉著媽媽的手。媽媽溫柔地說：「不用怕，我們一起看窗外的白雲。」爸爸也指著外面說：「下面像積木世界一樣呢！」Jadon慢慢放鬆下來，還開心地看著天空。最後，他興奮地說：「原來坐飛機這麼有趣！」',m:'道理：勇敢踏出第一步，就能看見更大的世界。'},
{t:'小朋友的生日',s:'今天是Jadon的生日，很多朋友來參加生日會。桌上有大蛋糕、果汁、糖果和很多禮物。大家一起唱生日歌，Jadon高興得不停拍手。媽媽提醒他：「記得先許願呀！」Jadon閉上眼睛，小聲地說：「希望大家天天都開心。」吹完蠟燭後，他把蛋糕分享給每一位朋友。整個房間都充滿笑聲和快樂。',m:'道理：快樂不只是自己擁有，也可以和別人分享。'}],
en:[
{t:'Sharing at the Park',s:'Today, Dad and Mum took Jadon to the park. There were many children there. Some were playing ball, and some were playing on the slide. Jadon ran happily with his little football. Suddenly, a child came over and asked softly, “Can I play too?” Jadon smiled and said, “Yes! Let’s play together!” The two children passed the ball, chased the ball, and had a wonderful time. On the way home, Mum said, “A child who is willing to share will have more friends.” Jadon nodded happily.',m:'Lesson: When we learn to share, we make more friends.'},
{t:'Swimming for the First Time',s:'It was a very hot summer day. Dad took Jadon to the seaside to swim. Big waves kept coming in, and Jadon felt a little scared. He held Dad’s hand tightly. Dad smiled and said, “Don’t be afraid. I am here with you.” Dad slowly taught him to splash with his hands and kick with his feet. After a while, Jadon could float by himself. He shouted happily, “Dad, I did it!” Mum took photos beside them. That night, Jadon kept smiling and said he was brave.',m:'Lesson: Do not be afraid to try. New things help us grow.'},
{t:'The Lost Bunny',s:'One day, Jadon and Mum went to the farm to see the animals. Jadon liked the white bunny best. Suddenly, one little bunny ran out of its wooden house and walked around again and again, as if it could not find the way home. Jadon asked worriedly, “Mum, is the bunny lost?” Mum nodded. Jadon slowly walked closer, gently picked up the bunny, and brought it back to its little house. The farmer smiled and said, “Thank you. The bunny is finally home.”',m:'Lesson: Helping others can make us happy too.'},
{t:'Learning to Write',s:'Today, Dad helped Jadon practise writing at home. Dad first wrote “one, two, three, four, five,” and then taught him “six, seven, eight, nine, ten.” At first, Jadon’s writing was crooked, and he felt unhappy. He said, “I can’t write well.” Dad smiled and answered, “Don’t rush. Take your time.” Jadon tried again carefully. At last, he wrote the words neatly. Mum saw his work and clapped happily. “Jadon has improved!” she said.',m:'Lesson: With patience, we can improve step by step.'},
{t:'Friends at the Park',s:'In the afternoon, many children were playing in the park. Jadon played football with his friends, sang songs, and went on the slide. Suddenly, one child fell down and sat on the ground crying. Jadon quickly ran over to help him stand up. He also gently brushed the sand off the child’s clothes. The teacher saw this and said, “Jadon is very caring.” The child smiled and said, “Thank you.” After that, everyone played happily together again.',m:'Lesson: Taking the initiative to help others is very important.'},
{t:'Family Dinner',s:'It was raining heavily outside. Jadon and his family were having dinner at home. Mum was cooking in the kitchen, and Dad helped set the table. Jadon was very helpful too. He brought bowls and chopsticks for everyone. During dinner, they shared what had happened that day. Dad smiled and said, “Being together as a family is the happiest time.” Jadon ate his dinner and smiled. The home was filled with warmth and love.',m:'Lesson: When family members care for one another, that is happiness.'},
{t:'Good Manners on the Bus',s:'Today, Mum took Jadon on a bus to the library. After they got on, Jadon saw an old lady slowly walking onto the bus, but there were no seats left. Mum gently asked, “Shall we give our seat to her?” Jadon stood up at once and said with a smile, “Grandma, please sit here.” The old lady was very happy. She patted Jadon’s head and said, “You are such a polite child.” Mum smiled proudly too.',m:'Lesson: Good manners and caring for others make everyone happy.'},
{t:'A Trip to the Zoo',s:'On Sunday, Dad and Mum took Jadon to the zoo. Jadon saw giraffes, elephants, lambs, and white rabbits. He clapped his hands happily. “Dad! The giraffe is really tall!” he said excitedly. Dad smiled and answered, “That is because it has a very long neck.” Later, they watched a sea lion show together. Mum reminded Jadon, “When we look at animals, we should not shout or feed them without permission.” Jadon nodded obediently.',m:'Lesson: When we enjoy animals, we should love and respect them.'},
{t:'The Four Seasons',s:'There are four seasons in a year: spring, summer, autumn, and winter. In spring, flowers bloom and birds sing in the trees. In summer, the weather is hot, and Jadon loves swimming most. In autumn, the leaves slowly turn red and yellow. In winter, it is cold, and everyone wears warm coats. The teacher asked, “Which season do you like best?” Jadon thought for a moment and smiled. “I like every season, because each one has its own happiness!”',m:'Lesson: Learn to appreciate the different beauty in life.'},
{t:'Counting Fruit',s:'Today, Mum bought many fruits home. On the table, there was a big watermelon, red apples, bananas, and oranges. Dad smiled and asked Jadon, “Can you help us count the fruit?” Jadon quickly stretched out his little hand and counted happily, “One, two, three, four…” At last, he counted the total number correctly. Mum praised him and said, “Jadon is becoming smarter and smarter!” After that, everyone shared the sweet fruit together.',m:'Lesson: Learning and sharing can both bring happiness.'},
{t:'Travelling by Plane',s:'The summer holiday arrived, and Jadon took a plane for the first time. When the plane slowly rose into the sky, Jadon felt a little scared and held Mum’s hand tightly. Mum said gently, “Don’t be afraid. Let’s look at the white clouds together.” Dad pointed outside and said, “Look, the world below looks like tiny building blocks.” Jadon slowly relaxed and looked happily at the sky. At last, he said excitedly, “Flying on a plane is so interesting!”',m:'Lesson: Take the first brave step, and you will see a bigger world.'},
{t:'A Child’s Birthday',s:'Today was Jadon’s birthday. Many friends came to his birthday party. On the table, there was a big cake, juice, candy, and many presents. Everyone sang the birthday song together, and Jadon clapped his hands happily. Mum reminded him, “Remember to make a wish first.” Jadon closed his eyes and said softly, “I hope everyone is happy every day.” After blowing out the candles, he shared the cake with every friend. The whole room was full of laughter and joy.',m:'Lesson: Happiness is not only for ourselves. We can share it with others.'}]
};
let lang='zh';
const storyImages=['Story 1.png','Story 2.PNG','Story 3.png','Story 4.png','Story 5.png','Story 6.png','Story 7.png','Story 8.png','Story 9.png','Story 10.png','Story 11.png','Story 12.png'];
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.getElementById('btnZh').classList.toggle('active',lang==='zh');document.getElementById('btnEn').classList.toggle('active',lang==='en');document.getElementById('pageTitle').textContent=lang==='zh'?'Jadon 的 12 個成長故事':'Jadon’s 12 Growing-Up Stories';document.getElementById('pageSub').textContent=lang==='zh'?'陪伴孩子快樂成長的每一天 💕':'Stories for every happy day of growing up 💕';document.getElementById('playAllBtn').textContent=lang==='zh'?'🎙️ 真人廣東話順序播放':'🎙️ Play English / Audio in Order';document.getElementById('audioNote').textContent=lang==='zh'?'可上載 audio/story1.mp3 至 audio/story12.mp3 使用真人錄音；未有錄音時會用瀏覽器朗讀。':'Upload audio/story1.mp3 to audio/story12.mp3 to use real recordings. If audio is missing, the browser voice will read aloud.';document.getElementById('grid').innerHTML=stories[lang].map((x,i)=>`<article class="card"><img class="storyimg" src="${storyImages[i]||'storybook.png'}" onclick="openZoom()"><h2>${i+1}. ${x.t}</h2><p class="readText" id="s${i+1}">${x.s}</p><div class="moral">${x.m}</div><button class="btn" onclick="playStory(${i+1})">${lang==='zh'?'🎙️ 廣東話跟讀':'🎙️ Read Aloud'}</button></article>`).join('');setupText();}
function setLang(l){speechSynthesis.cancel();lang=l;render();}
function setupText(){document.querySelectorAll('.readText').forEach(p=>{let t=p.innerText;p.dataset.text=t;p.innerHTML=[...t].map(c=>`<span class='char'>${c}</span>`).join('')})}
function playStory(n){let p=document.getElementById('s'+n),text=p.dataset.text||p.innerText;let u=new SpeechSynthesisUtterance(text);u.lang=lang==='zh'?'zh-HK':'en-US';u.rate=lang==='zh'?.88:.82;u.onboundary=e=>{let chars=p.querySelectorAll('.char');chars.forEach(x=>x.classList.remove('active'));let i=Math.min(chars.length-1,e.charIndex);if(chars[i])chars[i].classList.add('active')};speechSynthesis.cancel();speechSynthesis.speak(u)}
function playAll(){let i=1;speechSynthesis.cancel();function next(){if(i>12)return;let p=document.getElementById('s'+i);let u=new SpeechSynthesisUtterance(p.dataset.text);u.lang=lang==='zh'?'zh-HK':'en-US';u.rate=lang==='zh'?.88:.82;u.onend=()=>{i++;next()};speechSynthesis.speak(u)}next()}
function openZoom(){document.querySelector('.modal').classList.add('open')}function closeZoom(){document.querySelector('.modal').classList.remove('open')}render();
</script></body></html>
